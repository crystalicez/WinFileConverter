name: Preset hardening validation

on:
  pull_request:
    branches:
      - integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preset-inputtypes-hardening

      - name: Wire lazy default settings path once
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $path = "Application/FileConverterExtension/FileConverterExtension.cs"
          $content = [System.IO.File]::ReadAllText($path)
          $old = @"
            this.presetReferences = PresetReferenceHelpers.Load(
                PathHelpers.UserSettingsFilePath,
                PathHelpers.DefaultSettingsFilePath);
"@
          $new = @"
            this.presetReferences = PresetReferenceHelpers.Load(
                PathHelpers.UserSettingsFilePath,
                () => PathHelpers.DefaultSettingsFilePath);
"@

          if ($content.Contains($old)) {
              $content = $content.Replace($old, $new)
              [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($true))

              git config user.name "ChatGPT"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add $path
              git commit -m "fix: resolve shell default settings lazily"
              git push origin HEAD:fix/preset-inputtypes-hardening
          }

      - name: Build regression test project
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }

          & $msbuild Tests\FileConverter.Tests\FileConverter.Tests.csproj /restore /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Run regression tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }

          & $vstest Tests\FileConverter.Tests\bin\x64\${{ matrix.configuration }}\FileConverter.Tests.dll /Platform:x64
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE" }
