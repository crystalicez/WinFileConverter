name: Preset hardening validation

on:
  push:
    branches:
      - fix/preset-inputtypes-hardening
  pull_request:
    branches:
      - integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preset-inputtypes-hardening

      - name: Apply Task 2 production patch once
        shell: pwsh
        run: |
          function Replace-ExactLines {
              param(
                  [string]$Path,
                  [string[]]$OldLines,
                  [string[]]$NewLines
              )

              $content = [System.IO.File]::ReadAllText($Path)
              $newline = if ($content.Contains("`r`n")) { "`r`n" } else { "`n" }
              $old = [string]::Join($newline, $OldLines)
              $new = [string]::Join($newline, $NewLines)
              $first = $content.IndexOf($old, [System.StringComparison]::Ordinal)

              if ($first -lt 0) {
                  return $false
              }

              $second = $content.IndexOf($old, $first + $old.Length, [System.StringComparison]::Ordinal)
              if ($second -ge 0) {
                  throw "Expected exactly one match in $Path"
              }

              $content = $content.Remove($first, $old.Length).Insert($first, $new)
              [System.IO.File]::WriteAllText($Path, $content, [System.Text.UTF8Encoding]::new($true))
              return $true
          }

          $presetPath = "Application/FileConverter/ConversionPreset/ConversionPreset.cs"
          $settingsPath = "Application/FileConverter/Settings.cs"
          $changed = $false

          $changed = (Replace-ExactLines $presetPath @(
              '        private List<string> inputTypes;'
          ) @(
              '        private List<string> inputTypes = new List<string>();'
          )) -or $changed

          $changed = (Replace-ExactLines $presetPath @(
              '            set'
              '            {'
              '                this.inputTypes = value;'
              '                for (int index = 0; index < this.inputTypes.Count; index++)'
              '                {'
              '                    this.inputTypes[index] = this.inputTypes[index].ToLowerInvariant();'
              '                }'
              '                '
              '                this.OnPropertyChanged();'
              '            }'
          ) @(
              '            set'
              '            {'
              '                this.inputTypes = value == null ? new List<string>() : new List<string>(value);'
              '                this.NormalizeInputTypes();'
              '                this.OnPropertyChanged();'
              '            }'
          )) -or $changed

          $changed = (Replace-ExactLines $presetPath @(
              '        public void OnDeserializationComplete()'
              '        {'
              '            for (int index = 0; index < this.InputTypes.Count; index++)'
              '            {'
              '                this.InputTypes[index] = this.InputTypes[index].ToLowerInvariant();'
              '            }'
              ''
              '            this.CoerceInputTypes();'
              '        }'
          ) @(
              '        public void OnDeserializationComplete()'
              '        {'
              '            this.NormalizeInputTypes();'
              '            this.CoerceInputTypes();'
              '        }'
          )) -or $changed

          $changed = (Replace-ExactLines $presetPath @(
              '        public void AddInputType(string inputType)'
              '        {'
              '            if (this.inputTypes.Contains(inputType))'
          ) @(
              '        public void AddInputType(string inputType)'
              '        {'
              '            if (string.IsNullOrEmpty(inputType))'
              '            {'
              '                return;'
              '            }'
              ''
              '            inputType = inputType.ToLowerInvariant();'
              '            if (this.inputTypes.Contains(inputType))'
          )) -or $changed

          $changed = (Replace-ExactLines $presetPath @(
              '        private void CoerceInputTypes()'
          ) @(
              '        private void NormalizeInputTypes()'
              '        {'
              '            if (this.inputTypes == null)'
              '            {'
              '                this.inputTypes = new List<string>();'
              '                return;'
              '            }'
              ''
              '            for (int index = this.inputTypes.Count - 1; index >= 0; index--)'
              '            {'
              '                string inputType = this.inputTypes[index];'
              '                if (string.IsNullOrEmpty(inputType))'
              '                {'
              '                    this.inputTypes.RemoveAt(index);'
              '                    continue;'
              '                }'
              ''
              '                this.inputTypes[index] = inputType.ToLowerInvariant();'
              '            }'
              '        }'
              ''
              '        private void CoerceInputTypes()'
          )) -or $changed

          $changed = (Replace-ExactLines $settingsPath @(
              '        public void Clean()'
              '        {'
              '            for (int index = 0; index < this.ConversionPresets.Count; index++)'
              '            {'
              '                this.ConversionPresets[index].Clean();'
              '            }'
              '        }'
          ) @(
              '        public void Clean()'
              '        {'
              '            for (int index = this.ConversionPresets.Count - 1; index >= 0; index--)'
              '            {'
              '                ConversionPreset preset = this.ConversionPresets[index];'
              '                if (preset == null)'
              '                {'
              '                    this.ConversionPresets.RemoveAt(index);'
              '                    continue;'
              '                }'
              ''
              '                preset.Clean();'
              '            }'
              '        }'
          )) -or $changed

          $changed = (Replace-ExactLines $settingsPath @(
              '            for (int index = 0; index < settings.conversionPresets.Count; index++)'
              '            {'
              '                ConversionPreset conversionPreset = settings.conversionPresets[index];'
              '                if (this.conversionPresets.Any(match => match.FullName == conversionPreset.FullName))'
              '                {'
              '                    continue;'
              '                }'
              ''
              '                this.conversionPresets.Add(conversionPreset);'
              '            }'
          ) @(
              '            for (int index = 0; index < settings.conversionPresets.Count; index++)'
              '            {'
              '                ConversionPreset conversionPreset = settings.conversionPresets[index];'
              '                if (conversionPreset == null)'
              '                {'
              '                    continue;'
              '                }'
              ''
              '                if (this.conversionPresets.Any(match => match != null && match.FullName == conversionPreset.FullName))'
              '                {'
              '                    continue;'
              '                }'
              ''
              '                this.conversionPresets.Add(conversionPreset);'
              '            }'
          )) -or $changed

          $changed = (Replace-ExactLines $settingsPath @(
              '            set'
              '            {'
              '                for (int index = 0; index < value.Length; index++)'
              '                {'
              '                    this.ConversionPresets.Add(value[index]);'
              '                }'
              '            }'
          ) @(
              '            set'
              '            {'
              '                if (value == null)'
              '                {'
              '                    return;'
              '                }'
              ''
              '                for (int index = 0; index < value.Length; index++)'
              '                {'
              '                    ConversionPreset preset = value[index];'
              '                    if (preset != null)'
              '                    {'
              '                        this.ConversionPresets.Add(preset);'
              '                    }'
              '                }'
              '            }'
          )) -or $changed

          $changed = (Replace-ExactLines $settingsPath @(
              '            for (int index = 0; index < this.ConversionPresets.Count; index++)'
              '            {'
              '                this.ConversionPresets[index].OnDeserializationComplete();'
              '            }'
          ) @(
              '            for (int index = this.ConversionPresets.Count - 1; index >= 0; index--)'
              '            {'
              '                ConversionPreset preset = this.ConversionPresets[index];'
              '                if (preset == null)'
              '                {'
              '                    this.ConversionPresets.RemoveAt(index);'
              '                    continue;'
              '                }'
              ''
              '                preset.OnDeserializationComplete();'
              '            }'
          )) -or $changed

          if ($changed) {
              git config user.name "ChatGPT"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add $presetPath $settingsPath
              git commit -m "fix: harden preset input type model"
              git push origin HEAD:fix/preset-inputtypes-hardening
          }

      - name: Build regression test project
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }

          & $msbuild Tests\FileConverter.Tests\FileConverter.Tests.csproj /restore /t:Build /p:Configuration=Debug /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Run regression tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }

          & $vstest Tests\FileConverter.Tests\bin\x64\Debug\FileConverter.Tests.dll /Platform:x64
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE" }
